<html lang="te"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>రాయ్ ఎడ్యుకేషన్ - టూల్స్ అన్నీ ఒకే చోట</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--board:#1F4D3A;--board2:#173B2C;--chalk:#F7F3E3;--yellow:#F2C94C;--ink:#22302A;--paper:#FBFAF4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans Telugu','Baloo Tamma 2',sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{background:var(--board);color:var(--chalk);display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));min-height:56px;flex-shrink:0;z-index:30}
.hb{background:none;border:2px solid rgba(247,243,227,.35);color:var(--chalk);font-size:22px;width:42px;height:42px;border-radius:10px;cursor:pointer;flex-shrink:0;font-family:inherit}
.hb:focus-visible,.tile:focus-visible,.mi:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#back{display:none;width:auto;padding:0 14px;font-size:16px;font-weight:700;background:var(--yellow);color:var(--board2);border-color:var(--yellow)}
#back.show{display:block}
#ttl{font-family:'Baloo Tamma 2',sans-serif;font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#side{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:82vw;background:var(--board2);color:var(--chalk);transform:translateX(-100%);transition:transform .25s;z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#side.open{transform:none}
#side h2{font-family:'Baloo Tamma 2';font-size:20px;padding:16px;border-bottom:1px dashed rgba(247,243,227,.3);display:flex;justify-content:space-between;align-items:center}
#side nav{overflow-y:auto;flex:1;padding:8px}
.mi{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;color:var(--chalk);text-align:left;padding:12px;border-radius:10px;font-size:16px;font-family:inherit;cursor:pointer}
.mi:hover,.mi.act{background:rgba(242,201,76,.18)}
.mi .ic{font-size:22px;width:30px;text-align:center}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40}
#shade.open{display:block}
main{flex:1;position:relative;overflow:hidden}
#home{position:absolute;inset:0;overflow-y:auto;padding:22px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.hero{max-width:900px;margin:0 auto 18px;font-family:'Baloo Tamma 2';font-size:clamp(24px,5vw,34px);font-weight:800;color:var(--board);line-height:1.2}
.hero small{display:block;font-family:'Noto Sans Telugu';font-size:15px;font-weight:400;color:#5a6b62;margin-top:4px}
.grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid #dfe6dd;border-left:8px solid var(--board);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.tile:hover{border-color:var(--yellow);border-left-color:var(--board)}
.tile .ic{font-size:34px;width:48px;height:48px;display:grid;place-items:center;background:var(--board);color:var(--yellow);border-radius:12px;font-family:'Baloo Tamma 2';font-weight:800}
.tile b{font-family:'Baloo Tamma 2';font-size:19px;display:block}
.tile span{font-size:14px;color:#5a6b62}
footer{text-align:center;margin-top:28px;font-size:15px}
footer a{color:var(--board);font-weight:700;text-decoration:none;border-bottom:2px solid var(--yellow)}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
</style></head><body>

const $=id=>document.getElementById(id);
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
let cur=-1;
T.forEach((t,i)=>{
 const a=document.createElement('button');a.className='tile';
 a.innerHTML=`<div class="ic">${t.i}</div><div><b>${t.t}</b><span>${t.s}</span></div>`;
 a.onclick=()=>openTool(i,true);$('grid').appendChild(a);
 const m=document.createElement('button');m.className='mi';m.id='m'+i;
 m.innerHTML=`<span class="ic">${t.i}</span>${t.t}`;
 m.onclick=()=>openTool(i,true);$('nav').appendChild(m);
});
const hm=document.createElement('button');hm.className='mi';hm.innerHTML='<span class="ic">🏠</span>హోమ్';
hm.onclick=()=>{closeMenu();goHome()};$('nav').prepend(hm);
function openMenu(){$('side').classList.add('open');$('shade').classList.add('open')}
function closeMenu(){$('side').classList.remove('open');$('shade').classList.remove('open')}
$('menuBtn').onclick=()=>$('side').classList.contains('open')?closeMenu():openMenu();
$('closeBtn').onclick=closeMenu;$('shade').onclick=closeMenu;
function openTool(i,push){
 closeMenu();
 if(cur!==i){$('frame').srcdoc=dec(T[i].b)}
 cur=i;$('frame').style.display='block';$('home').style.display='none';
 $('ttl').textContent=T[i].t;$('back').classList.add('show');
 document.querySelectorAll('.mi').forEach(x=>x.classList.remove('act'));$('m'+i).classList.add('act');
 if(push)history.pushState({t:i},'','#t'+i);
 setTimeout(()=>{try{$('frame').focus()}catch(e){}},300);
}
function showHome(){
 cur=-1;$('frame').srcdoc='';$('frame').style.display='none';$('home').style.display='block';
 $('ttl').textContent='రాయ్ ఎడ్యుకేషన్ టూల్స్';$('back').classList.remove('show');
 document.querySelectorAll('.mi').forEach(x=>x.classList.remove('act'));
}
function goHome(){if(history.state&&history.state.t!==undefined)history.back();else showHome()}
$('back').onclick=goHome;$('homeBtn').onclick=goHome;
window.addEventListener('popstate',e=>{
 if($('side').classList.contains('open')){closeMenu()}
 if(e.state&&e.state.t!==undefined)openTool(e.state.t,false);else showHome();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){ if($('side').classList.contains('open'))closeMenu(); else if(cur>=0)goHome(); }
});
history.replaceState(null,'',location.pathname+location.search);
</script>
